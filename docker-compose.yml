services:
  # ─────────────────────────── Инфраструктура обмена сообщениями ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: eventapi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eventapi-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # Внешний listener для подключения с хоста (например, из dotnet run локально).
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Два listener'а: INTERNAL — для сервисов внутри сети Docker, EXTERNAL — для хоста.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # ─────────────────────────── Добавление топиков ───────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --topic events --partitions 1 --replication-factor 1 --if-not-exists
        kafka-topics --bootstrap-server kafka:29092 --create --topic bookings --partitions 1 --replication-factor 1 --if-not-exists
    restart: "no"
    
  # ─────────────────────────── Редис ───────────────────────────
    
  redis:
    image: redis:7.2-alpine
    container_name: eventapi-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────── Базы данных (по одной на сервис) ───────────────────────────
  users-db:
    image: postgres:16
    container_name: eventapi-users-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:16
    container_name: eventapi-events-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16
    container_name: eventapi-bookings-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────── Микросервисы ───────────────────────────
  users-service:
    build:
      context: .
      dockerfile: UserService/UserService.Api/Dockerfile
    container_name: eventapi-users-service
    ports:
      - "5134:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=users-db;Port=5432;Database=users;Username=postgres;Password=postgres"
      Kafka__BootstrapServers: "kafka:29092"
      Otlp__Endpoint: "jaeger:4317"
    depends_on:
      users-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  events-service:
    build:
      context: .
      dockerfile: EventService/EventService.Api/Dockerfile
    container_name: eventapi-events-service
    ports:
      - "5191:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=events-db;Port=5432;Database=events;Username=postgres;Password=postgres"
      Kafka__BootstrapServers: "kafka:29092"
      Redis__Host: "redis:6379"
      Otlp__Endpoint: "jaeger:4317"
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  bookings-service:
    build:
      context: .
      dockerfile: BookingService/BookingService.Api/Dockerfile
    container_name: eventapi-bookings-service
    ports:
      - "5099:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=bookings-db;Port=5432;Database=bookings;Username=postgres;Password=postgres"
      Kafka__BootstrapServers: "kafka:29092"
      Otlp__Endpoint: "jaeger:4317"
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
        
    # ─────────────────────────── Метрики ───────────────────────────
        
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: eventapi-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: eventapi-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: eventapi-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:
  grafana-data: